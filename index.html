<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吉他顧問 - 2026 典藏版</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] },
            colors: { gallery: '#121212', bronze: '#C5A059' }
          }
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
      if (window.Babel) {
        Babel.registerPreset("react-classic", {
          presets: [[Babel.availablePresets.react, { runtime: "classic" }]]
        });
      }
    </script>
    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useEffect, useMemo } = React;

        /* 音訊引擎 */
        const MIDI_OPEN = {6:40, 5:45, 4:50, 3:55, 2:59, 1:64};
        
        let globalAudioCtx = null;
        let globalMaster = null;
        const getAudioContext = () => {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                globalMaster = globalAudioCtx.createDynamicsCompressor();
                globalMaster.threshold.value = -18;
                globalMaster.knee.value = 16;
                globalMaster.ratio.value = 4;
                globalMaster.attack.value = 0.004;
                globalMaster.release.value = 0.22;
                globalMaster.connect(globalAudioCtx.destination);
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        };

        const playbackNotes = (dots) => {
            const notes = dots.map(n => ({...n, midi:MIDI_OPEN[n.string] + n.fret}));
            if (notes.length <= 12) return notes.sort((a,b)=>b.string-a.string);
            const byPitchClass = new Map();
            [...notes].sort((a,b)=>Math.abs(a.midi-60)-Math.abs(b.midi-60)).forEach(n => {
                const pc = n.midi % 12;
                if (!byPitchClass.has(pc)) byPitchClass.set(pc,n);
            });
            return [...byPitchClass.values()].sort((a,b)=>a.midi-b.midi).slice(0,12);
        };

        const pluckGuitar = (ctx, frequency, start, velocity = .72) => {
            const duration = 3.4;
            const length = Math.ceil(ctx.sampleRate * duration);
            const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            const period = Math.max(2, Math.round(ctx.sampleRate / frequency));
            for (let i=0; i<period && i<length; i++) data[i] = (Math.random()*2-1) * velocity;
            const damping = Math.min(.4994, .493 + frequency/90000);
            for (let i=period; i<length; i++) data[i] = damping * (data[i-period] + data[i-period+1]);
            const source = ctx.createBufferSource();
            const body = ctx.createBiquadFilter();
            const warmth = ctx.createBiquadFilter();
            const gain = ctx.createGain();
            source.buffer = buffer;
            body.type = 'peaking'; body.frequency.value = 185; body.Q.value = .8; body.gain.value = 4;
            warmth.type = 'lowpass'; warmth.frequency.value = Math.min(5200, 2500 + frequency*2); warmth.Q.value = .35;
            gain.gain.setValueAtTime(.0001,start);
            gain.gain.exponentialRampToValueAtTime(.62,start+.008);
            gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
            source.connect(body); body.connect(warmth); warmth.connect(gain); gain.connect(globalMaster);
            source.start(start); source.stop(start+duration);
        };

        const strikePiano = (ctx, frequency, start, velocity = .6) => {
            const partials = [[1,1,3.8],[2,.34,2.5],[3,.16,1.8],[4,.08,1.25],[6,.035,.8]];
            partials.forEach(([ratio,level,decay],index) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = index === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(frequency*ratio,start);
                osc.detune.value = index%2 ? 1.8 : -1.2;
                gain.gain.setValueAtTime(.0001,start);
                gain.gain.exponentialRampToValueAtTime(level*velocity,start+(index===0?.006:.003));
                gain.gain.exponentialRampToValueAtTime(.0001,start+decay);
                osc.connect(gain); gain.connect(globalMaster); osc.start(start); osc.stop(start+decay+.05);
            });
            const clickBuffer = ctx.createBuffer(1,Math.round(ctx.sampleRate*.018),ctx.sampleRate);
            const clickData = clickBuffer.getChannelData(0);
            for(let i=0;i<clickData.length;i++) clickData[i]=(Math.random()*2-1)*(1-i/clickData.length);
            const click=ctx.createBufferSource(), clickFilter=ctx.createBiquadFilter(), clickGain=ctx.createGain();
            click.buffer=clickBuffer; clickFilter.type='bandpass'; clickFilter.frequency.value=1800+frequency; clickFilter.Q.value=.7; clickGain.gain.value=.055*velocity;
            click.connect(clickFilter); clickFilter.connect(clickGain); clickGain.connect(globalMaster); click.start(start);
        };

        const playNotes = (dots, instrument = 'guitar') => {
            if (!dots || dots.length === 0) return;
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            playbackNotes(dots).forEach((n, i) => {
                const midi = n.midi;
                const frequency = 440 * Math.pow(2, (midi - 69) / 12);
                const start = now + (i * (instrument==='guitar' ? .052 : .035));
                if (instrument === 'piano') strikePiano(ctx,frequency,start,.58);
                else pluckGuitar(ctx,frequency,start,.72);
            });
        };

        const NOTES_C = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        const OPEN_S = {6:4, 5:9, 4:2, 3:7, 2:11, 1:4};
        const DEG_L = { 0: "1", 1: "b2", 2: "2", 3: "b3", 4: "3", 5: "4", 6: "b5", 7: "5", 8: "b6", 9: "6", 10: "b7", 11: "7" };

        const getRequiredIntervals = (intervals, count) => {
            let required = [...intervals];
            if (required.length <= count) return required;
            
            const dropOrder = [7, 2, 5, 9]; // 5th, 9th, 11th, 6th/13th
            for (let d of dropOrder) {
                if (required.includes(d) && required.length > count) {
                    required = required.filter(i => i !== d);
                }
            }
            while (required.length > count) required.pop();
            return required;
        };

        const generateVoicings = (rootPc, typeObj, stringsCount, group, isFriendly = false) => {
            const intervals = typeObj.intervals;
            let sets = [];
            if (stringsCount === 3) {
                if (group === 'root6') sets = [[6,5,4]];
                else if (group === 'root5') sets = [[5,4,3]];
                else if (group === 'mid') sets = [[4,3,2]];
                else if (group === 'high') sets = [[3,2,1]];
            } else {
                if (group === 'root6') sets = [[6,5,4,3]];
                else if (group === 'root5') sets = [[5,4,3,2]];
                else if (group === 'mid' || group === 'high') sets = [[4,3,2,1]];
            }

            const req = getRequiredIntervals(intervals, stringsCount);
            const reqPcs = req.map(i => (rootPc + i) % 12);
            let voicings = [];
            
            sets.forEach(strSet => {
                const build = (strIdx, currentVoicing) => {
                    if (strIdx === strSet.length) {
                        const playedPcs = currentVoicing.map(v => v.pc);
                        if (reqPcs.every(rpc => playedPcs.includes(rpc))) voicings.push(currentVoicing);
                        return;
                    }
                    const s = strSet[strIdx];
                    for (let f = 0; f <= 16; f++) {
                        const pc = (OPEN_S[s] + f) % 12;
                        if (intervals.includes((pc - rootPc + 12) % 12)) {
                            const frets = currentVoicing.map(v => v.fret).filter(fr => fr > 0);
                            if (f > 0) frets.push(f);
                            const maxSpan = isFriendly ? 3 : 4;
                            if (frets.length > 0 && Math.max(...frets) - Math.min(...frets) > maxSpan) continue;
                            if (strIdx === 0 && (group === 'root6' || group === 'root5' || group === 'mid') && stringsCount === 4 && pc !== rootPc) continue;
                            if (strIdx === 0 && stringsCount === 3 && (group === 'root6' || group === 'root5') && pc !== rootPc) continue;
                            
                            build(strIdx + 1, [...currentVoicing, { string: s, fret: f, pc, note: NOTES_C[pc], degree: DEG_L[(pc - rootPc + 12) % 12], isRoot: pc === rootPc }]);
                        }
                    }
                };
                build(0, []);
            });
            
            voicings.sort((a, b) => {
                const avgA = a.reduce((sum, v) => sum + v.fret, 0) / a.length;
                const avgB = b.reduce((sum, v) => sum + v.fret, 0) / b.length;
                return avgA - avgB;
            });
            return voicings;
        };

        /* 指板板塊 - 精確對齊版 */
        const Fretboard = ({ dots, disp, instrument = 'guitar' }) => (
            <div className="fretboard-frame animate-in">
                <div className="string-labels-side">
                    {[1,2,3,4,5,6].map(s => <div key={s} className="string-tag">{s === 1 ? '1st' : s === 6 ? '6th' : `${s}`}</div>)}
                </div>
                <div className="flex flex-col">
                    <div className="fret-grid-master">
                        {/* 琴枕 */}
                        <div className="fret-col nut">
                            {[1,2,3,4,5,6].map(s => (
                                <div key={s} className="fret-space">
                                    {dots.filter(d=>d.string===s && d.fret===0).map((d,idx) => (
                                        <div key={idx} className={`note-orb ${d.isRoot?'root':''}`} onClick={()=>playNotes([d],instrument)}>
                                            {disp==='note' ? d.note : d.degree}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                        {/* 品格 1-24 */}
                        {Array.from({length: 24}).map((_, f) => {
                            const fret = f + 1;
                            return (
                                <div key={fret} className="fret-col">
                                    {[3,5,7,9,12,15,17,19,21,24].includes(fret) && <div className="inlay-dot"></div>}
                                    {[1,2,3,4,5,6].map(s => (
                                        <div key={s} className="fret-space">
                                            {dots.filter(d=>d.string===s && d.fret===fret).map((d,idx) => (
                                                <div key={idx} className={`note-orb ${d.isRoot?'root':''}`} onClick={()=>playNotes([d],instrument)}>
                                                    {disp==='note' ? d.note : d.degree}
                                                </div>
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            );
                        })}
                    </div>
                    <div className="fret-nums-bar">
                        {Array.from({length: 24}).map((_, i) => <div key={i} className="fret-n">{i+1}</div>)}
                    </div>
                </div>
            </div>
        );

        const NOTE_ALIASES = {DB:'C#', EB:'D#', GB:'F#', AB:'G#', BB:'A#', CB:'B', FB:'E', 'E#':'F', 'B#':'C'};
        const CUSTOM_BASES = [
            {test:/^maj13/i, take:5, zh:'大十三', en:'Major 13th', degrees:['1','3','5','7','9','13'], intervals:[0,4,7,11,2,9]},
            {test:/^maj11/i, take:5, zh:'大十一', en:'Major 11th', degrees:['1','3','5','7','9','11'], intervals:[0,4,7,11,2,5]},
            {test:/^maj9/i, take:4, zh:'大九', en:'Major 9th', degrees:['1','3','5','7','9'], intervals:[0,4,7,11,2]},
            {test:/^maj7/i, take:4, zh:'大七', en:'Major 7th', degrees:['1','3','5','7'], intervals:[0,4,7,11]},
            {test:/^m\(maj13\)|^mmaj13/i, take:null, zh:'小大十三', en:'Minor-major 13th', degrees:['1','b3','5','7','9','11','13'], intervals:[0,3,7,11,2,5,9]},
            {test:/^m\(maj11\)|^mmaj11/i, take:null, zh:'小大十一', en:'Minor-major 11th', degrees:['1','b3','5','7','9','11'], intervals:[0,3,7,11,2,5]},
            {test:/^m\(maj9\)|^mmaj9/i, take:null, zh:'小大九', en:'Minor-major 9th', degrees:['1','b3','5','7','9'], intervals:[0,3,7,11,2]},
            {test:/^m7b5/i, take:4, zh:'半減七', en:'Half-diminished 7th', degrees:['1','b3','b5','b7'], intervals:[0,3,6,10]},
            {test:/^m\(maj7\)|^mmaj7/i, take:null, zh:'小大七', en:'Minor-major 7th', degrees:['1','b3','5','7'], intervals:[0,3,7,11]},
            {test:/^m13/i, take:3, zh:'小十三', en:'Minor 13th', degrees:['1','b3','5','b7','9','11','13'], intervals:[0,3,7,10,2,5,9]},
            {test:/^m11/i, take:3, zh:'小十一', en:'Minor 11th', degrees:['1','b3','5','b7','9','11'], intervals:[0,3,7,10,2,5]},
            {test:/^m9/i, take:2, zh:'小九', en:'Minor 9th', degrees:['1','b3','5','b7','9'], intervals:[0,3,7,10,2]},
            {test:/^m7/i, take:2, zh:'小七', en:'Minor 7th', degrees:['1','b3','5','b7'], intervals:[0,3,7,10]},
            {test:/^dim7/i, take:4, zh:'減七', en:'Diminished 7th', degrees:['1','b3','b5','bb7'], intervals:[0,3,6,9]},
            {test:/^13/i, take:2, zh:'屬十三', en:'Dominant 13th', degrees:['1','3','5','b7','9','13'], intervals:[0,4,7,10,2,9]},
            {test:/^11/i, take:2, zh:'屬十一', en:'Dominant 11th', degrees:['1','3','5','b7','9','11'], intervals:[0,4,7,10,2,5]},
            {test:/^9/i, take:1, zh:'屬九', en:'Dominant 9th', degrees:['1','3','5','b7','9'], intervals:[0,4,7,10,2]},
            {test:/^7/i, take:1, zh:'屬七', en:'Dominant 7th', degrees:['1','3','5','b7'], intervals:[0,4,7,10]},
            {test:/^maj/i, take:3, zh:'大三', en:'Major', degrees:['1','3','5'], intervals:[0,4,7]},
            {test:/^m(?!aj)/i, take:1, zh:'小三', en:'Minor', degrees:['1','b3','5'], intervals:[0,3,7]},
            {test:/^dim/i, take:3, zh:'減三', en:'Diminished', degrees:['1','b3','b5'], intervals:[0,3,6]},
            {test:/^aug|^\+/i, take:3, zh:'增三', en:'Augmented', degrees:['1','3','#5'], intervals:[0,4,8]},
            {test:/^sus2/i, take:4, zh:'掛二', en:'Suspended 2nd', degrees:['1','2','5'], intervals:[0,2,7]},
            {test:/^sus4/i, take:4, zh:'掛四', en:'Suspended 4th', degrees:['1','4','5'], intervals:[0,5,7]},
            {test:/^5/i, take:1, zh:'強力', en:'Power', degrees:['1','5'], intervals:[0,7]},
            {test:/^/i, take:0, zh:'大三', en:'Major', degrees:['1','3','5'], intervals:[0,4,7]}
        ];

        const parseCustomChord = (input) => {
            const clean = input.trim().replace(/♯/g,'#').replace(/♭/g,'b').replace(/\s+/g,'');
            const hit = clean.match(/^([A-Ga-g](?:#|b)?)(.*)$/);
            if (!hit) return null;
            const rawRoot = hit[1].toUpperCase();
            const root = NOTE_ALIASES[rawRoot] || rawRoot[0] + (rawRoot[1] || '');
            if (!NOTES_C.includes(root)) return null;
            let suffix = hit[2];
            const base = CUSTOM_BASES.find(x => x.test.test(suffix));
            const matched = suffix.match(base.test)?.[0] || '';
            suffix = suffix.slice(base.take === null ? matched.length : base.take);
            const degrees = [...base.degrees];
            const intervals = [...base.intervals];
            const extensionMap = {
                'b9':['b9',1], '9':['9',2], '#9':['#9',3], '11':['11',5], '#11':['#11',6],
                'b13':['b13',8], '13':['13',9]
            };
            const tokens = [...suffix.matchAll(/(?:\+|add)?(b9|#9|9|#11|11|b13|13)/gi)].map(m=>m[1].toLowerCase());
            const leftover = suffix.replace(/(?:\+|add)?(b9|#9|9|#11|11|b13|13)/gi,'');
            if (leftover.length > 0) return null;
            tokens.forEach(token => {
                const [degree, interval] = extensionMap[token];
                if (!intervals.includes(interval)) { intervals.push(interval); degrees.push(degree); }
            });
            return {
                root,
                typeObj: {id:'custom', label:hit[2], zh:`${base.zh}自訂和弦`, en:`Custom ${base.en} chord`, formula:degrees.join('-'), intervals},
                mode:'chord'
            };
        };

        const DetailSheet = ({ root, typeObj, mode, onClose, t, lang }) => {
            const [disp, setDisp] = useState('note');
            const [vMode, setVMode] = useState('arpeggio');
            const [sCount, setSCount] = useState(4);
            const [sGroup, setSGroup] = useState('root6');
            const [vIndex, setVIndex] = useState(0);
            const [isFriendly, setIsFriendly] = useState(false);
            const [instrument, setInstrument] = useState('guitar');

            const { dots, availableVoicings } = useMemo(() => {
                const rootPc = NOTES_C.indexOf(root);
                if (mode === 'chord' && vMode === 'voicing') {
                    const vs = generateVoicings(rootPc, typeObj, sCount, sGroup, isFriendly);
                    return { dots: vs[vIndex] || [], availableVoicings: vs.length };
                }

                const res = [];
                for (let s=1; s<=6; s++) {
                    for (let f=0; f<=24; f++) {
                        const pc = (OPEN_S[s] + f) % 12;
                        if (typeObj.intervals.includes((pc - rootPc + 12) % 12)) {
                            res.push({ string: s, fret: f, pc, note: NOTES_C[pc], degree: DEG_L[(pc - rootPc + 12) % 12], isRoot: pc === rootPc });
                        }
                    }
                }
                return { dots: res, availableVoicings: 0 };
            }, [root, typeObj, mode, vMode, sCount, sGroup, vIndex, isFriendly]);

            return (
                <div className="gallery-overlay animate-in">
                    <div className="max-w-6xl mx-auto">
                        <button onClick={onClose} className="mb-12 text-bronze text-[11px] uppercase tracking-[0.4em] flex items-center hover:opacity-50 transition">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" className="mr-2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            {t.back}
                        </button>
                        <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-10">
                            <div>
                                <div className="catalog-label">{mode==='chord'? t.chord : t.scale}</div>
                                <h2 className="text-6xl font-serif text-white">{root} {lang === 'zh' ? typeObj.zh : typeObj.en}</h2>
                                <div className="mt-4 flex flex-wrap gap-3 items-center">
                                    {mode === 'chord' && <span className="text-bronze font-mono text-lg">{root}{typeObj.label}</span>}
                                    <span className="text-[11px] text-zinc-500 font-mono tracking-widest">{typeObj.formula || typeObj.intervals.join('-')}</span>
                                </div>
                            </div>
                            <div className="flex flex-col gap-4 items-end">
                                <div className="flex gap-4">
                                    <button onClick={()=>playNotes(dots,instrument)} className="minimal-btn">{t.play}</button>
                                    <button onClick={()=>setDisp(disp==='note'?'deg':'note')} className="minimal-btn">
                                        {lang === 'zh' ? (disp === 'note' ? '顯示度數' : '顯示音名') : (disp === 'note' ? 'Show Degrees' : 'Show Notes')}
                                    </button>
                                </div>
                                <div className="instrument-switch" aria-label={lang==='zh'?'選擇音色':'Choose instrument'}>
                                    <button onClick={()=>setInstrument('guitar')} className={instrument==='guitar'?'active':''}>{lang==='zh'?'吉他':'Guitar'}</button>
                                    <button onClick={()=>setInstrument('piano')} className={instrument==='piano'?'active':''}>{lang==='zh'?'鋼琴':'Piano'}</button>
                                </div>
                                {mode === 'chord' && (
                                    <div className="flex bg-white/5 rounded-full p-1 mt-2">
                                        <button onClick={()=>setVMode('arpeggio')} className={`px-4 py-1.5 text-[10px] uppercase tracking-widest rounded-full transition-all ${vMode==='arpeggio'?'bg-bronze text-black':'text-white hover:bg-white/10'}`}>
                                            {lang==='zh'?'琶音全景':'Arpeggio'}
                                        </button>
                                        <button onClick={()=>{setVMode('voicing'); setVIndex(0);}} className={`px-4 py-1.5 text-[10px] uppercase tracking-widest rounded-full transition-all ${vMode==='voicing'?'bg-bronze text-black':'text-white hover:bg-white/10'}`}>
                                            {lang==='zh'?'具體按法':'Voicing'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {mode === 'chord' && vMode === 'voicing' && (
                            <div className="flex flex-col md:flex-row gap-6 mb-12 border-y border-white/5 py-6 items-center justify-between">
                                <div className="flex gap-4 items-center">
                                    <span className="text-[10px] text-zinc-500 uppercase tracking-widest">{lang==='zh'?'指型弦數':'Strings'}:</span>
                                    {[3, 4].map(c => (
                                        <button key={c} onClick={()=>{setSCount(c); setVIndex(0);}} className={`text-[11px] px-3 py-1 border transition-all ${sCount===c?'text-bronze border-bronze':'text-zinc-600 border-transparent hover:text-zinc-400'}`}>
                                            {c} {lang==='zh'?'弦':'Str'}
                                        </button>
                                    ))}
                                    <button onClick={()=>{setIsFriendly(!isFriendly); setVIndex(0);}} className={`text-[11px] px-3 py-1 border transition-all ml-2 ${isFriendly?'text-bronze border-bronze bg-bronze/10':'text-zinc-600 border-zinc-800 hover:text-zinc-400'}`}>
                                        {lang==='zh'?'友好模式':'Friendly'}
                                    </button>
                                </div>
                                <div className="flex gap-4 overflow-x-auto no-scrollbar">
                                    {(sCount === 3 ? [
                                        {id:'root6', label: lang==='zh'?'第 6-5-4 弦':'Strings 6-5-4'},
                                        {id:'root5', label: lang==='zh'?'第 5-4-3 弦':'Strings 5-4-3'},
                                        {id:'mid', label: lang==='zh'?'第 4-3-2 弦':'Strings 4-3-2'},
                                        {id:'high', label: lang==='zh'?'第 3-2-1 弦':'Strings 3-2-1'}
                                    ] : [
                                        {id:'root6', label: lang==='zh'?'根音在第6弦':'Root on 6th'},
                                        {id:'root5', label: lang==='zh'?'根音在第5弦':'Root on 5th'},
                                        {id:'mid', label: lang==='zh'?'根音在第4弦':'Root on 4th'}
                                    ]).map(g => (

                        {no:'03',title:'Seventh chords and function',body:'Add a seventh above a triad. maj7 is stable; m7 often serves as ii; dominant 7 contains a tritone and resolves strongly; m7b5 commonly begins a minor ii–V–i.',tip:'Start with Dm7–G7–Cmaj7, then move it through all twelve keys.'},
                        {no:'04',title:'Extensions: 9, 11, and 13',body:'Extensions are 2, 4, and 6 placed above the octave. On guitar, you rarely need every chord tone. Keep the 3rd, 7th, and defining color tones.',tip:'The bass can cover the root; the 5th is usually the first note to omit.'},
                        {no:'05',title:'Diatonic chords',body:'Major-key seventh chords are Imaj7, IIm7, IIIm7, IVmaj7, V7, VIm7, and VIIm7b5. These relationships transpose to every key and position.',tip:'Map Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, and Bm7b5 in one fretboard area.'},
                        {no:'06',title:'Voice leading for jazz guitar',body:'Keep common tones in place and move each remaining voice to the nearest chord tone. Smooth motion matters more than adding more notes.',tip:'Play only the 3rds and 7ths through a ii–V–I and watch the half-step movement.'}
                    ];
                    return (
                        <section className="theory-page max-w-6xl mx-auto mt-16 animate-in">
                            <div className="theory-hero">
                                <span>{lang==='zh'?'吉他基本樂理':'GUITAR MUSIC THEORY'}</span>
                                <h2>{lang==='zh'?'從指板理解和聲':'Understand harmony through the fretboard'}</h2>
                                <p>{lang==='zh'?'六個單元，從音程到爵士和弦連接。每一段都能直接用吉他練習。':'Six practical lessons from intervals to jazz voice leading, designed to be played on guitar.'}</p>
                            </div>
                            <div className="theory-map">
                                <div><b>1</b><span>{lang==='zh'?'根音':'Root'}</span></div><i>+</i><div><b>3 / b3</b><span>{lang==='zh'?'決定大小調':'Chord quality'}</span></div><i>+</i><div><b>7 / b7</b><span>{lang==='zh'?'決定功能':'Function'}</span></div><i>+</i><div><b>9 · 11 · 13</b><span>{lang==='zh'?'增加色彩':'Color'}</span></div>
                            </div>
                            <div className="lesson-grid">{lessons.map(x=><article key={x.no}><small>{x.no}</small><h3>{x.title}</h3><p>{x.body}</p><div><b>{lang==='zh'?'吉他練習':'Guitar practice'}</b>{x.tip}</div></article>)}</div>
                        </section>
                    );
                }
                if (mode === 'builder') {
                    const examples = ['Cmaj7+9','Cm7+11','C7+b9+13','Fmaj7+#11','G7+#9','Bm7b5+11'];
                    const preview = parseCustomChord(builderInput);
                    return (
                        <section className="chord-lab max-w-5xl mx-auto mt-16 animate-in">
                            <div className="lab-kicker">{lang==='zh'?'自訂和弦':'CUSTOM CHORD'}</div>
                            <h2>{lang==='zh'?'輸入和弦，立即查看指板':'Enter a chord and view it on the fretboard'}</h2>
                            <p>{lang==='zh'?'支援根音、和弦性質與 +9、+11、+13 等延伸音。':'Supports roots, chord qualities, and extensions such as +9, +11, and +13.'}</p>
                            <div className="chord-command">
                                <input value={builderInput} onChange={e=>{setBuilderInput(e.target.value);setBuilderError('');}} onKeyDown={e=>e.key==='Enter'&&openBuiltChord()} aria-label={lang==='zh'?'輸入和弦':'Enter chord'} placeholder="Cmaj7+9" />
                                <button onClick={()=>openBuiltChord()}>{lang==='zh'?'顯示和弦':'Show chord'}</button>
                            </div>
                            <div className="builder-preview">
                                <span>{lang==='zh'?'解析結果':'Result'}</span>
                                <strong>{preview ? `${preview.root}${preview.typeObj.label}` : '—'}</strong>
                                <code>{preview?.typeObj.formula || '—'}</code>
                            </div>
                            {builderError && <div className="builder-error">{builderError}</div>}
                            <div className="example-row">
                                <span>{lang==='zh'?'範例':'Examples'}</span>
                                {examples.map(x=><button key={x} onClick={()=>openBuiltChord(x)}>{x}</button>)}
                            </div>
                            <div className="extension-grid">
                                {[
                                    ['+9',lang==='zh'?'加入九度音':'Add the 9th'],
                                    ['+11',lang==='zh'?'加入十一度音':'Add the 11th'],
                                    ['+13',lang==='zh'?'加入十三度音':'Add the 13th'],
                                    ['b9 / #9',lang==='zh'?'變化九度音':'Altered 9ths'],
                                    ['#11',lang==='zh'?'升十一度音':'Sharp 11th'],
                                    ['b13',lang==='zh'?'降十三度音':'Flat 13th']
                                ].map(([symbol,label])=><div key={symbol}><strong>{symbol}</strong><span>{label}</span></div>)}
                            </div>
                        </section>
                    );
                }
                if (!catId) {
                    const list = mode === 'chord' ? db.ch.CHORD_CATEGORIES : db.sc.SCALE_CATEGORIES;
                    const q = libraryQuery.trim().toLowerCase().replace(/^\+/, '');
                    const searchResults = mode === 'chord' && q ? db.ch.CHORD_TYPES.filter(it => [it.label,it.zh,it.en,it.formula].some(v=>(v||'').toLowerCase().includes(q))) : [];
                    return (
                        <div className="max-w-3xl mx-auto mt-20 animate-in">
                            {mode === 'chord' && <div className="library-search">
                                <span>⌕</span><input value={libraryQuery} onChange={e=>setLibraryQuery(e.target.value)} placeholder={lang==='zh'?'搜尋名稱、簡寫或結構，例如 maj7、+11':'Search name, symbol, or formula, e.g. maj7, +11'} />
                                {libraryQuery && <button onClick={()=>setLibraryQuery('')}>×</button>}
                            </div>}
                            {searchResults.length > 0 && <div className="search-results mb-12">
                                <div className="catalog-label">{lang==='zh'?`找到 ${searchResults.length} 個和弦`:`${searchResults.length} chords found`}</div>
                                {searchResults.map(it=><div key={it.id} onClick={()=>setTypeObj(it)} className="gallery-list-item compact"><div><strong>{it.label || 'Major'}</strong><span>{lang==='zh'?it.zh:it.en}</span></div><code>{it.formula}</code></div>)}
                            </div>}
                            <div className="catalog-label text-center mb-10">{lang==='zh'?'分類目錄':'Categories'}</div>
                            {list.map((c, i) => (
                                <div key={c.id} onClick={()=>setCatId(c.id)} className="gallery-list-item">
                                    <h3 className="font-serif">{t.cat[c.key] || c.id}</h3>
                                    <span className="text-bronze opacity-50 text-[10px] tracking-widest uppercase">{lang==='zh'?'選擇':'Select'}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                if (!typeObj) {
                    const cat = (mode === 'chord' ? db.ch.CHORD_CATEGORIES : db.sc.SCALE_CATEGORIES).find(x => x.id === catId);
                    const items = mode === 'chord' ? db.ch.CHORD_TYPES.filter(it => cat.list.includes(it.id)) : db.sc.SCALES.filter(it => cat.list.includes(it.id));
                    return (
                        <div className="max-w-3xl mx-auto mt-20 animate-in">
                            <button onClick={()=>setCatId(null)} className="mb-12 text-bronze text-[11px] uppercase tracking-[0.4em] flex items-center hover:opacity-50 transition">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" className="mr-2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                {t.back}
                            </button>
                            <div className="catalog-label mb-8">{t.cat[cat.key]}</div>
                            {items.map((it, i) => (
                                <div key={it.id} onClick={()=>setTypeObj(it)} className="gallery-list-item">
                                    <div className="flex flex-col">
                                        <span className="text-white text-xl font-serif">{lang==='zh' ? it.zh : it.en}</span>
                                        <span className="text-[10px] text-zinc-600 tracking-widest mt-1 uppercase font-mono">
                                            {mode === 'chord' ? `${lang==='zh'?'譜面簡寫':'Chart symbol'}: ${it.label || '（根音字母）'} · ${it.formula}` : it.intervals.map(i => DEG_L[i]).join(' · ')}
                                        </span>
                                    </div>
                                    <span className="text-[10px] text-bronze/40 font-mono">#{String(i+1).padStart(3,'0')}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return (
                    <div className="max-w-4xl mx-auto mt-20 text-center animate-in">
                        <button onClick={()=>setTypeObj(null)} className="mb-12 text-bronze text-[11px] uppercase tracking-[0.4em] flex items-center justify-center hover:opacity-50 transition mx-auto">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" className="mr-2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            {t.back}
                        </button>
                        <div className="catalog-label">{lang==='zh'?'選擇根音':'Select Root'}</div>
                        <h2 className="text-5xl text-white mb-6 font-serif">{lang==='zh' ? typeObj.zh : typeObj.en}</h2>
                        {mode === 'chord' && <div className="text-bronze font-mono tracking-widest mb-16">{lang==='zh'?'譜面簡寫':'Chart symbol'}: C{typeObj.label} · {typeObj.formula}</div>}
                        {mode === 'scale' && typeObj.id === 'minor' && <div className="text-bronze font-mono tracking-widest mb-16">{lang==='zh'?'提示：選擇 G♯ 即為五個升記號的升 G 小調':'Tip: choose G# for G-sharp minor, the minor key with five sharps'}</div>}
                        {mode === 'scale' && typeObj.id !== 'minor' && <div className="mb-16"></div>}
                        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-6">
                            {NOTES_C.map((n, i) => (
                                <button key={n} onClick={()=>setDetail({root:n, typeObj, mode})} className="border border-white/5 py-10 text-white font-serif text-2xl hover:border-bronze hover:text-bronze transition-all">
                                    <span>{n}</span>
                                    {mode === 'scale' && typeObj.id === 'minor' && n === 'G#' && <span className="block mt-2 text-[9px] font-sans tracking-widest text-bronze">{lang==='zh'?'五升小調':'5-sharp minor'}</span>}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-40">
                    <div className="fixed top-8 right-8 flex gap-4 z-[1000] animate-in">
                        <button className={`utility-btn ${lang==='zh'?'active':''}`} onClick={()=>setLang('zh')}>ZH</button>
                        <button className={`utility-btn ${lang==='en'?'active':''}`} onClick={()=>setLang('en')}>EN</button>
                        <div className="w-4"></div>
                        <button className="utility-btn" onClick={()=>setIsLight(!isLight)}>
                            {isLight ? 'DARK' : 'LIGHT'}
                        </button>
                    </div>
                    <header className="gallery-header animate-in">
                        <h1 className="gallery-title">{t.title}</h1>
                        <div className="edition-label">{t.edition} / {lang==='zh'?'2026 典藏版':'2026 Collection'}</div>
                        <div className="mt-16 flex justify-center gap-16">
                            <button onClick={()=>{setMode('chord'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='chord'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t.chord}</button>
                            <button onClick={()=>{setMode('scale'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='scale'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t.scale}</button>
                            <button onClick={()=>{setMode('builder'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='builder'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{lang==='zh'?'和弦組合器':'Chord Builder'}</button>
                            <button onClick={()=>{setMode('theory'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='theory'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{lang==='zh'?'基本樂理':'Music Theory'}</button>
                        </div>
                    </header>
                    <main>{renderMain()}</main>
                    {detail && <DetailSheet {...detail} onClose={()=>setDetail(null)} t={t} lang={lang} />}
                    <footer className="text-center py-10 mt-20 border-t border-white/5">
                        <p className="text-[10px] text-zinc-600 tracking-[0.25em] uppercase">
                            © 2026 Brian&amp;Code. All Rights Reserved.
                        </p>
                        <p className="text-[10px] text-zinc-700 tracking-widest mt-2">
                            {lang === 'zh' ? '更多作品請至' : 'Visit us at'}{' '}
                            <a href="https://brian53013new.github.io/Brian-Code-Official-website/" target="_blank" rel="noopener noreferrer" className="text-bronze/60 hover:text-bronze transition-colors underline underline-offset-2">
                                {lang === 'zh' ? 'Brian&Code 官方網站' : 'Brian&Code Official Website'}
                            </a>
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
