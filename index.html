<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吉他顧問 - 2026 典藏版</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <script>
      (function () {
        const key = 'guitar-advisor-theme';
        const allowed = ['classic', 'dark-professional', 'minimal-light', 'vintage-jazz', 'tech-blue', 'forest-green'];
        try {
          const saved = localStorage.getItem(key);
          document.documentElement.dataset.theme = allowed.includes(saved) ? saved : 'classic';
        } catch (_) {
          document.documentElement.dataset.theme = 'classic';
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] },
            colors: { gallery: '#121212', bronze: '#C5A059' }
          }
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
      if (window.Babel) {
        Babel.registerPreset("react-classic", {
          presets: [[Babel.availablePresets.react, { runtime: "classic" }]]
        });
      }
    </script>
    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useEffect, useMemo, useRef } = React;

        /* 音訊引擎 */
        const MIDI_OPEN = {6:40, 5:45, 4:50, 3:55, 2:59, 1:64};
        
        let globalAudioCtx = null;
        let globalMaster = null;
        const getAudioContext = () => {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                globalMaster = globalAudioCtx.createDynamicsCompressor();
                globalMaster.threshold.value = -18;
                globalMaster.knee.value = 16;
                globalMaster.ratio.value = 4;
                globalMaster.attack.value = 0.004;
                globalMaster.release.value = 0.22;
                globalMaster.connect(globalAudioCtx.destination);
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        };

        const playbackNotes = (dots) => {
            const notes = dots.map(n => ({...n, midi:MIDI_OPEN[n.string] + n.fret}));
            if (notes.length <= 12) return notes.sort((a,b)=>b.string-a.string);
            const byPitchClass = new Map();
            [...notes].sort((a,b)=>Math.abs(a.midi-60)-Math.abs(b.midi-60)).forEach(n => {
                const pc = n.midi % 12;
                if (!byPitchClass.has(pc)) byPitchClass.set(pc,n);
            });
            return [...byPitchClass.values()].sort((a,b)=>a.midi-b.midi).slice(0,12);
        };

        const pluckGuitar = (ctx, frequency, start, velocity = .72) => {
            const duration = 3.4;
            const length = Math.ceil(ctx.sampleRate * duration);
            const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            const period = Math.max(2, Math.round(ctx.sampleRate / frequency));
            for (let i=0; i<period && i<length; i++) data[i] = (Math.random()*2-1) * velocity;
            const damping = Math.min(.4994, .493 + frequency/90000);
            for (let i=period; i<length; i++) data[i] = damping * (data[i-period] + data[i-period+1]);
            const source = ctx.createBufferSource();
            const body = ctx.createBiquadFilter();
            const warmth = ctx.createBiquadFilter();
            const gain = ctx.createGain();
            source.buffer = buffer;
            body.type = 'peaking'; body.frequency.value = 185; body.Q.value = .8; body.gain.value = 4;
            warmth.type = 'lowpass'; warmth.frequency.value = Math.min(5200, 2500 + frequency*2); warmth.Q.value = .35;
            gain.gain.setValueAtTime(.0001,start);
            gain.gain.exponentialRampToValueAtTime(.62,start+.008);
            gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
            source.connect(body); body.connect(warmth); warmth.connect(gain); gain.connect(globalMaster);
            source.start(start); source.stop(start+duration);
        };

        const strikePiano = (ctx, frequency, start, velocity = .6) => {
            const partials = [[1,1,3.8],[2,.34,2.5],[3,.16,1.8],[4,.08,1.25],[6,.035,.8]];
            partials.forEach(([ratio,level,decay],index) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = index === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(frequency*ratio,start);
                osc.detune.value = index%2 ? 1.8 : -1.2;
                gain.gain.setValueAtTime(.0001,start);
                gain.gain.exponentialRampToValueAtTime(level*velocity,start+(index===0?.006:.003));
                gain.gain.exponentialRampToValueAtTime(.0001,start+decay);
                osc.connect(gain); gain.connect(globalMaster); osc.start(start); osc.stop(start+decay+.05);
            });
            const clickBuffer = ctx.createBuffer(1,Math.round(ctx.sampleRate*.018),ctx.sampleRate);
            const clickData = clickBuffer.getChannelData(0);
            for(let i=0;i<clickData.length;i++) clickData[i]=(Math.random()*2-1)*(1-i/clickData.length);
            const click=ctx.createBufferSource(), clickFilter=ctx.createBiquadFilter(), clickGain=ctx.createGain();
            click.buffer=clickBuffer; clickFilter.type='bandpass'; clickFilter.frequency.value=1800+frequency; clickFilter.Q.value=.7; clickGain.gain.value=.055*velocity;
            click.connect(clickFilter); clickFilter.connect(clickGain); clickGain.connect(globalMaster); click.start(start);
        };

        const playNotes = (dots, instrument = 'guitar') => {
            if (!dots || dots.length === 0) return;
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            playbackNotes(dots).forEach((n, i) => {
                const midi = n.midi;
                const frequency = 440 * Math.pow(2, (midi - 69) / 12);
                const start = now + (i * (instrument==='guitar' ? .052 : .035));
                if (instrument === 'piano') strikePiano(ctx,frequency,start,.58);
                else pluckGuitar(ctx,frequency,start,.72);
            });
        };

        const NOTES_C = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        const OPEN_S = {6:4, 5:9, 4:2, 3:7, 2:11, 1:4};
        const DEG_L = { 0: "1", 1: "b2", 2: "2", 3: "b3", 4: "3", 5: "4", 6: "b5", 7: "5", 8: "b6", 9: "6", 10: "b7", 11: "7" };

        const intervalSet = (intervals, candidates) => candidates.filter(i => intervals.includes(i));

        const voicingRequirements = (intervals, stringCount, includeRoot) => {
            const third = intervalSet(intervals, [3,4]);
            const seventh = intervalSet(intervals, [9,10,11]);
            const colors = intervalSet(intervals, [1,2,5,6,8]).filter(i => !third.includes(i));
            const required = [];
            if (includeRoot && intervals.includes(0)) required.push(0);
            if (third.length) required.push(third[0]);
            else if (intervals.includes(5)) required.push(5);
            if (seventh.length) required.push(seventh[0]);
            if (colors.length && required.length < stringCount) required.push(colors[colors.length - 1]);
            if (!includeRoot && !seventh.length && colors.length && required.length < Math.min(3, stringCount)) required.push(colors[0]);
            return [...new Set(required)].slice(0, stringCount);
        };

        const generateVoicings = (rootPc, typeObj, selectedStrings, includeRoot = true, isFriendly = false) => {
            const strings = [...selectedStrings].sort((a,b)=>b-a);
            if (strings.length < 2) return [];
            const intervals = typeObj.intervals;
            const required = voicingRequirements(intervals, strings.length, includeRoot);
            if (required.length > strings.length) return [];
            const maxSpan = isFriendly ? 3 : 5;
            const upperFret = isFriendly ? 14 : 17;
            const voicings = [];
            const candidatesByString = strings.map(string => {
                const candidates = [];
                for (let fret=0; fret<=upperFret; fret++) {
                    const pc = (OPEN_S[string] + fret) % 12;
                    const interval = (pc-rootPc+12)%12;
                    if (intervals.includes(interval) && (includeRoot || interval !== 0)) {
                        candidates.push({string, fret, pc, note:NOTES_C[pc], degree:DEG_L[interval], isRoot:interval===0, interval});
                    }
                }
                return candidates;
            });

            const build = (index, current) => {
                if (voicings.length >= 500) return;
                if (index === strings.length) {
                    const played = new Set(current.map(n=>n.interval));
                    if (!required.every(i=>played.has(i))) return;
                    if (includeRoot && !played.has(0)) return;
                    if (!includeRoot && played.has(0)) return;
                    const thirdOrSus = intervalSet(intervals,[3,4,5]);
                    if (thirdOrSus.length && !thirdOrSus.some(i=>played.has(i))) return;
                    const seventh = intervalSet(intervals,[9,10,11]);
                    if (!includeRoot && seventh.length && !seventh.some(i=>played.has(i))) return;
                    voicings.push(current);
                    return;
                }
                for (const candidate of candidatesByString[index]) {
                    const frets = current.map(n=>n.fret).filter(f=>f>0);
                    if (candidate.fret>0) frets.push(candidate.fret);
                    if (frets.length && Math.max(...frets)-Math.min(...frets)>maxSpan) continue;
                    build(index+1,[...current,candidate]);
                }
            };
            build(0,[]);
            return voicings.sort((a,b) => {
                const score = notes => {
                    const frets=notes.map(n=>n.fret).filter(Boolean);
                    const span=frets.length?Math.max(...frets)-Math.min(...frets):0;
                    const duplicates=notes.length-new Set(notes.map(n=>n.interval)).size;
                    const open=notes.filter(n=>n.fret===0).length;
                    return span*12 + duplicates*6 + open*1.5 + notes.reduce((sum,n)=>sum+n.fret,0)/notes.length;
                };
                return score(a)-score(b);
            }).slice(0,48);
        };

        /* Shared interactive fretboard. Chord voicings focus on their actual position;
           scales and arpeggios retain the full 24-fret view. */
        const Fretboard = ({ dots = [], disp = 'note', instrument = 'guitar', full = false, ariaLabel = 'Guitar fretboard' }) => {
            const [selected, setSelected] = useState(null);
            const fretted = dots.map(dot=>dot.fret).filter(fret=>fret > 0);
            const low = fretted.length ? Math.min(...fretted) : 1;
            const high = fretted.length ? Math.max(...fretted) : 5;
            const startFret = full ? 1 : Math.max(1, low - 1);
            const endFret = full ? 24 : Math.min(24, Math.max(startFret + 3, high + 1));
            const displayedFrets = Array.from({length:endFret-startFret+1},(_,index)=>startFret+index);
            const selectNote = note => { setSelected(note); playNotes([note], instrument); };
            const renderNote = note => note && <button type="button" className={`note-orb ${note.isRoot?'root':''} ${selected===note?'selected':''}`} onClick={()=>selectNote(note)} aria-label={`${note.note}, ${note.degree}, string ${note.string}, fret ${note.fret}`} title={`${note.note} · ${note.degree} · ${note.string}弦 ${note.fret}格`}>
                {disp==='note' ? note.note : note.degree}
            </button>;
            return <div className={`interactive-fretboard ${full?'is-full':'is-positioned'}`} aria-label={ariaLabel}>
                <div className="fretboard-frame animate-in" tabIndex="0">
                    <div className="string-labels-side">{[1,2,3,4,5,6].map(string=><div key={string} className="string-tag">{string === 1 ? '1st' : string === 6 ? '6th' : string}</div>)}</div>
                    <div className="fretboard-scroll">
                        <div className="fret-grid-master">
                            <div className="fret-col nut" aria-label="Open strings">{[1,2,3,4,5,6].map(string=><div key={string} className="fret-space">{renderNote(dots.find(dot=>dot.string===string && dot.fret===0))}</div>)}</div>
                            {displayedFrets.map(fret=><div key={fret} className="fret-col">{[3,5,7,9,12,15,17,19,21,24].includes(fret) && <div className="inlay-dot"/>}{[1,2,3,4,5,6].map(string=><div key={string} className="fret-space">{renderNote(dots.find(dot=>dot.string===string && dot.fret===fret))}</div>)}</div>)}
                        </div>
                        <div className="fret-nums-bar"><div className="fret-n nut-number">0</div>{displayedFrets.map(fret=><div key={fret} className="fret-n">{fret}</div>)}</div>
                    </div>
                </div>
                <div className="fretboard-meta"><span>{full ? '1–24 fret range' : `${startFret}–${endFret} fret position`}</span><span>{dots.filter(dot=>dot.fret===0).length ? `Open strings: ${dots.filter(dot=>dot.fret===0).map(dot=>dot.string).join(', ')}` : 'No open strings'}</span></div>
                {selected && <div className="fretboard-note-detail" role="status"><b>{selected.note}</b><span>{selected.degree} · {selected.string} {selected.string===1?'st':selected.string===2?'nd':selected.string===3?'rd':'th'} string · fret {selected.fret}</span><small>Click plays this note</small></div>}
            </div>;
        };

        const NOTE_ALIASES = {DB:'C#', EB:'D#', GB:'F#', AB:'G#', BB:'A#', CB:'B', FB:'E', 'E#':'F', 'B#':'C'};
        const CUSTOM_BASES = [
            {test:/^maj13/i, take:5, zh:'大十三', en:'Major 13th', degrees:['1','3','5','7','9','13'], intervals:[0,4,7,11,2,9]},
            {test:/^maj11/i, take:5, zh:'大十一', en:'Major 11th', degrees:['1','3','5','7','9','11'], intervals:[0,4,7,11,2,5]},
            {test:/^maj9/i, take:4, zh:'大九', en:'Major 9th', degrees:['1','3','5','7','9'], intervals:[0,4,7,11,2]},
            {test:/^maj7/i, take:4, zh:'大七', en:'Major 7th', degrees:['1','3','5','7'], intervals:[0,4,7,11]},
            {test:/^m\(maj13\)|^mmaj13/i, take:null, zh:'小大十三', en:'Minor-major 13th', degrees:['1','b3','5','7','9','11','13'], intervals:[0,3,7,11,2,5,9]},
            {test:/^m\(maj11\)|^mmaj11/i, take:null, zh:'小大十一', en:'Minor-major 11th', degrees:['1','b3','5','7','9','11'], intervals:[0,3,7,11,2,5]},
            {test:/^m\(maj9\)|^mmaj9/i, take:null, zh:'小大九', en:'Minor-major 9th', degrees:['1','b3','5','7','9'], intervals:[0,3,7,11,2]},
            {test:/^m7b5/i, take:4, zh:'半減七', en:'Half-diminished 7th', degrees:['1','b3','b5','b7'], intervals:[0,3,6,10]},
            {test:/^m\(maj7\)|^mmaj7/i, take:null, zh:'小大七', en:'Minor-major 7th', degrees:['1','b3','5','7'], intervals:[0,3,7,11]},
            {test:/^m13/i, take:3, zh:'小十三', en:'Minor 13th', degrees:['1','b3','5','b7','9','11','13'], intervals:[0,3,7,10,2,5,9]},
            {test:/^m11/i, take:3, zh:'小十一', en:'Minor 11th', degrees:['1','b3','5','b7','9','11'], intervals:[0,3,7,10,2,5]},
            {test:/^m9/i, take:2, zh:'小九', en:'Minor 9th', degrees:['1','b3','5','b7','9'], intervals:[0,3,7,10,2]},
            {test:/^m7/i, take:2, zh:'小七', en:'Minor 7th', degrees:['1','b3','5','b7'], intervals:[0,3,7,10]},
            {test:/^dim7/i, take:4, zh:'減七', en:'Diminished 7th', degrees:['1','b3','b5','bb7'], intervals:[0,3,6,9]},
            {test:/^13/i, take:2, zh:'屬十三', en:'Dominant 13th', degrees:['1','3','5','b7','9','13'], intervals:[0,4,7,10,2,9]},
            {test:/^11/i, take:2, zh:'屬十一', en:'Dominant 11th', degrees:['1','3','5','b7','9','11'], intervals:[0,4,7,10,2,5]},
            {test:/^9/i, take:1, zh:'屬九', en:'Dominant 9th', degrees:['1','3','5','b7','9'], intervals:[0,4,7,10,2]},
            {test:/^7/i, take:1, zh:'屬七', en:'Dominant 7th', degrees:['1','3','5','b7'], intervals:[0,4,7,10]},
            {test:/^maj/i, take:3, zh:'大三', en:'Major', degrees:['1','3','5'], intervals:[0,4,7]},
            {test:/^m(?!aj)/i, take:1, zh:'小三', en:'Minor', degrees:['1','b3','5'], intervals:[0,3,7]},
            {test:/^dim/i, take:3, zh:'減三', en:'Diminished', degrees:['1','b3','b5'], intervals:[0,3,6]},
            {test:/^aug|^\+/i, take:3, zh:'增三', en:'Augmented', degrees:['1','3','#5'], intervals:[0,4,8]},
            {test:/^sus2/i, take:4, zh:'掛二', en:'Suspended 2nd', degrees:['1','2','5'], intervals:[0,2,7]},
            {test:/^sus4/i, take:4, zh:'掛四', en:'Suspended 4th', degrees:['1','4','5'], intervals:[0,5,7]},
            {test:/^5/i, take:1, zh:'強力', en:'Power', degrees:['1','5'], intervals:[0,7]},
            {test:/^/i, take:0, zh:'大三', en:'Major', degrees:['1','3','5'], intervals:[0,4,7]}
        ];

        const parseCustomChord = (input) => {
            const clean = input.trim().replace(/♯/g,'#').replace(/♭/g,'b').replace(/\s+/g,'');
            const hit = clean.match(/^([A-Ga-g](?:#|b)?)(.*)$/);
            if (!hit) return null;
            const rawRoot = hit[1].toUpperCase();
            const root = NOTE_ALIASES[rawRoot] || rawRoot[0] + (rawRoot[1] || '');
            if (!NOTES_C.includes(root)) return null;
            let suffix = hit[2];
            const base = CUSTOM_BASES.find(x => x.test.test(suffix));
            const matched = suffix.match(base.test)?.[0] || '';
            suffix = suffix.slice(base.take === null ? matched.length : base.take);
            const degrees = [...base.degrees];
            const intervals = [...base.intervals];
            const extensionMap = {
                'b9':['b9',1], '9':['9',2], '#9':['#9',3], '11':['11',5], '#11':['#11',6],
                'b13':['b13',8], '13':['13',9]
            };
            const tokens = [...suffix.matchAll(/(?:\+|add)?(b9|#9|9|#11|11|b13|13)/gi)].map(m=>m[1].toLowerCase());
            const leftover = suffix.replace(/(?:\+|add)?(b9|#9|9|#11|11|b13|13)/gi,'');
            if (leftover.length > 0) return null;
            tokens.forEach(token => {
                const [degree, interval] = extensionMap[token];
                if (!intervals.includes(interval)) { intervals.push(interval); degrees.push(degree); }
            });
            return {
                root,
                typeObj: {id:'custom', label:hit[2], zh:`${base.zh}自訂和弦`, en:`Custom ${base.en} chord`, formula:degrees.join('-'), intervals},
                mode:'chord'
            };
        };

        const ADDABLE_TONES = [
            {interval:2, symbol:'9', zh:'2 / 9', en:'2 / 9'}, {interval:1, symbol:'b9', zh:'♭9', en:'b9'},
            {interval:3, symbol:'#9', zh:'♯9', en:'#9'}, {interval:5, symbol:'11', zh:'4 / 11', en:'4 / 11'},
            {interval:6, symbol:'#11', zh:'♯11', en:'#11'}, {interval:9, symbol:'13', zh:'6 / 13', en:'6 / 13'},
            {interval:8, symbol:'b13', zh:'♭13', en:'b13'}
        ];

        const THEME_STORAGE_KEY = 'guitar-advisor-theme';
        const THEME_OPTIONS = [
            {id:'classic', zh:'經典風格', en:'Classic'},
            {id:'dark-professional', zh:'深色專業', en:'Dark Professional'},
            {id:'minimal-light', zh:'極簡淺色', en:'Minimal Light'},
            {id:'vintage-jazz', zh:'爵士復古', en:'Vintage Jazz'},
            {id:'tech-blue', zh:'科技藍', en:'Tech Blue'},
            {id:'forest-green', zh:'森林綠', en:'Forest Green'}
        ];

        // Shared release schema. Drafts are visible only in authenticated preview/dev builds;
        // the public site will not auto-announce them before approval.
        const RELEASE_DIGEST = {
            siteId:'guitar-helper-gm', siteName:'吉他幫手 GM', version:'1.1.0', releasedAt:null, status:'draft',
            summary:'重新整理和弦資料與指法工作流程，讓搜尋、比較、轉調、加音與爵士無根音排列共用一致的互動指板。',
            highlights:['和弦分類、名稱與音程分析更一致','Rootless Voicing 與六弦發聲條件控制','多重和弦查詢、轉調與移調夾整合','收藏、最近瀏覽、比較與六種風格保存'],
            improvements:['大型指法切換控制與即時狀態回饋','手機版觸控操作與智慧把位範圍','加音模擬器支援自訂音名、音程、琴弦與琴格'],
            fixes:['移除聽辨選擇題與答題統計的舊狀態流程'],
            officialReleaseUrl:'https://brian53013new.github.io/Brian-Code-Official-website/'
        };
        const UPDATE_NOTICE_STORAGE_KEY = `guitar-helper-gm-update-${RELEASE_DIGEST.version}`;
        const IS_RELEASE_PREVIEW = RELEASE_DIGEST.status === 'draft' && (
            new URLSearchParams(window.location.search).get('previewRelease') === '1' ||
            window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ||
            window.location.hostname.endsWith('.chatgpt.site')
        );
        const SHOULD_SHOW_RELEASE = RELEASE_DIGEST.status === 'published' || IS_RELEASE_PREVIEW;

        const readLocal = (key, fallback = null) => {
            try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
        };
        const writeLocal = (key, value) => {
            try { localStorage.setItem(key, value); } catch (_) {}
        };

        const FAVORITES_STORAGE_KEY = 'guitar-advisor-favorites-v1';
        const RECENTS_STORAGE_KEY = 'guitar-advisor-recents-v1';
        const MAX_RECENTS = 24;
        const readJson = (key, fallback) => {
            try { const parsed = JSON.parse(localStorage.getItem(key) || ''); return parsed ?? fallback; } catch (_) { return fallback; }
        };
        const formatViewedAt = (value, lang) => {
            if (!value) return '';
            const diff = Math.max(0, Date.now() - new Date(value).getTime());
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return lang==='zh' ? '剛剛' : 'Just now';
            if (minutes < 60) return lang==='zh' ? `${minutes} 分鐘前` : `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return lang==='zh' ? `${hours} 小時前` : `${hours}h ago`;
            return new Date(value).toLocaleDateString(lang==='zh'?'zh-TW':'en-US');
        };

rateVoicings(shapePc,item.type,[6,5,4,3],true,true)[0]||[];const record={...buildVoicingRecord(shape,item.type,dots,capo),soundingRoot:sounding};return <article className="multi-chord-card" key={`${symbol}-${index}`}><div className="multi-card-head"><span>{index+1}</span><div><h3>{symbol} <i>→</i> {sounding}{item.type.label}</h3><small>{capo?(lang==='zh'?`按奏：${shape}${item.type.label}（Capo ${capo}）`:`Shape: ${shape}${item.type.label} (Capo ${capo})`):(lang==='zh'?`發聲：${sounding}${item.type.label}`:`Sounding: ${sounding}${item.type.label}`)}</small></div><div className="multi-order"><button onClick={()=>move(index,-1)} disabled={index===0} aria-label="Move chord earlier">↑</button><button onClick={()=>move(index,1)} disabled={index===symbols.length-1} aria-label="Move chord later">↓</button><button onClick={()=>setSymbols(current=>current.filter((_,itemIndex)=>itemIndex!==index))} aria-label="Remove chord">×</button></div></div><Fretboard dots={dots} disp="note" ariaLabel={`${sounding}${item.type.label} fretboard`}/><div className="saved-actions"><button onClick={()=>playNotes(dots,'guitar')}>{lang==='zh'?'播放':'Play'}</button><button onClick={()=>onOpen(record)}>{lang==='zh'?'指法與把位':'Voicing controls'}</button><button onClick={()=>onFavorite(record)}>{lang==='zh'?'收藏':'Save'}</button><button onClick={()=>onCompare(record)}>{lang==='zh'?'比較':'Compare'}</button></div></article>})}</div>{!parsed.length&&<div className="feature-empty"><b>{lang==='zh'?'尚未找到和弦':'No chords found'}</b><p>{lang==='zh'?'請輸入例如 C、Am、F、G7、Bbmaj7 或 F#m7b5。':'Try C, Am, F, G7, Bbmaj7, or F#m7b5.'}</p></div>}</section>;

            const toggleFavorite = (record) => setFavorites(current => {
                const exists = current.some(item=>item.key===record.key);
                notify(lang==='zh' ? (exists ? '已從收藏移除' : '已加入收藏') : (exists ? 'Removed from favorites' : 'Added to favorites'));
                return exists ? current.filter(item=>item.key!==record.key) : [{...record,savedAt:new Date().toISOString()},...current];
            });
            const addRecent = (record) => setRecents(current => [{...record,viewedAt:new Date().toISOString()},...current.filter(item=>item.key!==record.key)].slice(0,MAX_RECENTS));
            const toggleCompare = (record) => setCompareItems(current => {
                const exists = current.some(item=>item.key===record.key);
                notify(lang==='zh' ? (exists ? '已從比較區移除' : '已加入指法比較') : (exists ? 'Removed from comparison' : 'Added to comparison'));
                return exists ? current.filter(item=>item.key!==record.key) : [...current,record].slice(-3);
            });
            const restoreRecord = (record) => {
                const known = db.ch.CHORD_TYPES.find(item=>item.id===record.typeId);
                const restoredType = known || {id:record.typeId,label:record.label,zh:record.zh||record.label,en:record.en||record.label,formula:record.formula,intervals:record.intervals||[]};
                setDetail({root:record.root,typeObj:restoredType,mode:'chord',presetVoicing:record.dots,presetOptions:record});
            };

            const renderMain = () => {
                if (mode === 'favorites') return <CollectionPage kind="favorites" items={favorites} lang={lang} onOpen={restoreRecord} onRemove={key=>setFavorites(current=>current.filter(item=>item.key!==key))} onFavorite={toggleFavorite} onCompare={toggleCompare}/>;
                if (mode === 'recent') return <CollectionPage kind="recent" items={recents} lang={lang} onOpen={restoreRecord} onRemove={key=>setRecents(current=>current.filter(item=>item.key!==key))} onClear={()=>setRecents([])} onCompare={toggleCompare}/>;
                if (mode === 'compare') return <ComparePage items={compareItems} lang={lang} onOpen={restoreRecord} onRemove={key=>setCompareItems(current=>current.filter(item=>item.key!==key))}/>;
                if (mode === 'practice') return <PracticeMode chordTypes={db.ch.CHORD_TYPES} lang={lang} onNotify={notify}/>;
                if (mode === 'transpose') return <MultiChordQuery chordTypes={db.ch.CHORD_TYPES} lang={lang} onOpen={restoreRecord} onFavorite={toggleFavorite} onCompare={toggleCompare} onNotify={notify}/>;
                if (mode === 'theory') {
                    const lessons = lang === 'zh' ? [
                        {no:'01',title:'指板上的音程',body:'把根音當作 1。往高一格是小二度，兩格是大二度，三格是小三度，四格是大三度，七格是完全五度。相同形狀移到不同根音，音程關係不變。',tip:'先記住第 6、5 弦根音，再用形狀定位其他音。'},
                        {no:'02',title:'三和弦如何形成',body:'從音階隔一個音堆疊：1–3–5 是大三和弦；1–b3–5 是小三和弦；1–b3–b5 是減三和弦；1–3–#5 是增三和弦。',tip:'練習只彈三條弦的封閉三和弦，能更快看懂和聲。'},
                        {no:'03',title:'七和弦與功能',body:'在三和弦上再疊一個七度。maj7 聲音穩定；m7 常作小調或 ii 級；7 含三全音，通常推向主和弦；m7b5 常出現在小調 ii–V–i。',tip:'先練 Dm7–G7–Cmaj7，再移調到十二個調。'},
                        {no:'04',title:'延伸和弦與加音不同',body:'9、11、13 是跨過八度的 2、4、6；在常用和弦符號中，它們通常延續七和弦的結構。add9、add11 則是在三和弦上額外加入音，並不暗示七度；6/9 也含六度與九度、但不含七度。爵士吉他不必把所有音都按出來，通常保留 3、7 與重要色彩音。',tip:'根音可交給貝斯；五度通常最先省略。'},
                        {no:'05',title:'調內和弦',body:'大調七級和弦依序是 Imaj7、IIm7、IIIm7、IVmaj7、V7、VIm7、VIIm7b5。理解級數後，可以用同一組關係在任何把位與調性中移動。',tip:'用 C 大調先找出 Cmaj7、Dm7、Em7、Fmaj7、G7、Am7、Bm7b5。'},
                        {no:'06',title:'爵士吉他的 Voice Leading',body:'換和弦時，讓共同音留在原位，其餘聲部移到最近的和弦音。好的連接通常比使用更多音更重要。',tip:'只彈每個和弦的 3 與 7，觀察它們在 ii–V–I 中如何半音移動。'}
                    ] : [
                        {no:'01',title:'Intervals on the fretboard',body:'Treat the root as 1. One fret is a minor 2nd, two frets a major 2nd, three a minor 3rd, four a major 3rd, and seven a perfect 5th. Shapes preserve their interval relationships when moved.',tip:'Learn roots on strings 6 and 5 first, then locate the remaining notes from those anchors.'},
                        {no:'02',title:'Building triads',body:'Stack alternate scale tones. 1–3–5 makes a major triad; 1–b3–5 minor; 1–b3–b5 diminished; and 1–3–#5 augmented.',tip:'Practice closed triads on three strings to see harmony more clearly.'},
                        {no:'03',title:'Seventh chords and function',body:'Add a seventh above a triad. maj7 is stable; m7 often serves as ii; dominant 7 contains a tritone and resolves strongly; m7b5 commonly begins a minor ii–V–i.',tip:'Start with Dm7–G7–Cmaj7, then move it through all twelve keys.'},
                        {no:'04',title:'Extensions are not add chords',body:'9, 11, and 13 are 2, 4, and 6 placed above the octave; in standard chord symbols they normally continue a seventh-chord structure. add9 and add11 add a tone to a triad without implying a seventh, while 6/9 contains 6 and 9 but no seventh. On guitar, you rarely need every tone: keep the 3rd, 7th, and defining colors.',tip:'The bass can cover the root; the 5th is usually the first note to omit.'},
                        {no:'05',title:'Diatonic chords',body:'Major-key seventh chords are Imaj7, IIm7, IIIm7, IVmaj7, V7, VIm7, and VIIm7b5. These relationships transpose to every key and position.',tip:'Map Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, and Bm7b5 in one fretboard area.'},
                        {no:'06',title:'Voice leading for jazz guitar',body:'Keep common tones in place and move each remaining voice to the nearest chord tone. Smooth motion matters more than adding more notes.',tip:'Play only the 3rds and 7ths through a ii–V–I and watch the half-step movement.'}
                    ];
                    return (
                        <section className="theory-page max-w-6xl mx-auto mt-16 animate-in">
                            <div className="theory-hero">
                                <span>{lang==='zh'?'吉他基本樂理':'GUITAR MUSIC THEORY'}</span>
                                <h2>{lang==='zh'?'從指板理解和聲':'Understand harmony through the fretboard'}</h2>
                                <p>{lang==='zh'?'六個單元，從音程到爵士和弦連接。每一段都能直接用吉他練習。':'Six practical lessons from intervals to jazz voice leading, designed to be played on guitar.'}</p>
                            </div>
                            <div className="theory-map">
                                <div><b>1</b><span>{lang==='zh'?'根音':'Root'}</span></div><i>+</i><div><b>3 / b3</b><span>{lang==='zh'?'決定大小調':'Chord quality'}</span></div><i>+</i><div><b>7 / b7</b><span>{lang==='zh'?'決定功能':'Function'}</span></div><i>+</i><div><b>9 · 11 · 13</b><span>{lang==='zh'?'增加色彩':'Color'}</span></div>
                            </div>
                            <div className="lesson-grid">{lessons.map(x=><article key={x.no}><small>{x.no}</small><h3>{x.title}</h3><p>{x.body}</p><div><b>{lang==='zh'?'吉他練習':'Guitar practice'}</b>{x.tip}</div></article>)}</div>
                        </section>
                    );
                }
                if (mode === 'builder') {
                    const baseChoices = ['Maj','m','7','Maj7','m7','m7b5','dim7','6','m6','69','sus2','sus4','7sus4'];
                    return (
                        <section className="chord-lab max-w-5xl mx-auto mt-16 animate-in">
                            <div className="lab-kicker">{lang==='zh'?'和弦加音模擬器':'CHORD ADD-NOTE SIMULATOR'}</div>
                            <h2>{lang==='zh'?'以既有和弦為基礎，加入一或兩個音':'Start with a chord, then add one or two notes'}</h2>
                            <p>{lang==='zh'?'系統會先辨識原和弦，再依新增音給出常用名稱、實際音組與可演奏指法。':'The system identifies the base chord first, then names the result and finds playable guitar voicings.'}</p>
                            <div className="simulator-grid">
                                <div className="sim-step"><span>01</span><label>{lang==='zh'?'選擇根音':'Choose root'}</label><div className="root-pills">{NOTES_C.map(note=><button key={note} onClick={()=>setSimRoot(note)} className={simRoot===note?'selected':''}>{note}</button>)}</div></div>
                                <div className="sim-step"><span>02</span><label>{lang==='zh'?'選擇基礎和弦':'Choose base chord'}</label><select value={simBaseId} onChange={e=>{setSimBaseId(e.target.value);setSimAdditions([]);}}>{baseChoices.map(id=>{const item=db.ch.CHORD_TYPES.find(ch=>ch.id===id); return <option key={id} value={id}>{simRoot}{item.label || 'Major'} — {lang==='zh'?item.zh:item.en}</option>})}</select></div>
                                 <div className="sim-step"><span>03</span><label>{lang==='zh'?'加入一或兩個音':'Add one or two notes'}</label><div className="add-tone-pills">{ADDABLE_TONES.map(tone=>{const exists=simulatorBase.intervals.includes(tone.interval); const selected=simAdditions.includes(tone.interval); return <button key={tone.symbol} disabled={exists} onClick={()=>toggleAddition(tone.interval)} className={selected?'selected':''}>{tone.symbol}<small>{exists ? (lang==='zh'?'已包含':'included') : (lang==='zh'?tone.zh:tone.en)}</small></button>})}</div></div>
                             </div>
                            <div className="custom-add-tone"><div><span>04</span><h3>{lang==='zh'?'自訂加音':'Custom add-note'}</h3><p>{lang==='zh'?'輸入 A–G（可含 #／b）或 2、4、6、9、11、13；系統會核對指定琴弦與琴格。':'Enter A–G (with optional #/b) or 2, 4, 6, 9, 11, 13. The selected string and fret are validated.'}</p></div><label>{lang==='zh'?'音名／音程':'Note / interval'}<input value={customTone} onChange={event=>setCustomTone(event.target.value)} placeholder="A, Bb, #11, 9"/></label><label>{lang==='zh'?'琴弦':'String'}<select value={customString} onChange={event=>setCustomString(event.target.value)}>{[6,5,4,3,2,1].map(string=><option key={string} value={string}>{string}</option>)}</select></label><label>{lang==='zh'?'琴格':'Fret'}<input type="number" min="0" max="24" value={customFret} onChange={event=>setCustomFret(Math.max(0,Math.min(24,Number(event.target.value))))}/></label><button type="button" onClick={addCustomTone}>{lang==='zh'?'驗證並加入':'Validate & add'}</button><button type="button" onClick={resetCustomTone}>{lang==='zh'?'還原原始和弦':'Reset base chord'}</button>{customToneError&&<div className="custom-tone-error" role="alert">{customToneError}</div>}{customToneDot&&<div className="custom-tone-preview"><Fretboard dots={[customToneDot]} disp="note" ariaLabel="Custom added note"/></div>}</div>
                            <div className="builder-preview">
                                <span>{lang==='zh'?'分析結果':'Analysis'}</span>
                                <strong>{simRoot}{simulatedChord.label}</strong>
                                <code>{simulatedChord.formula}</code>
                                <button onClick={openSimulatedChord}>{lang==='zh'?'查看指法':'View voicings'}</button>
                            </div>
                            <div className="sim-note-summary"><b>{lang==='zh'?'新增音':'Added notes'}</b>{simulatedChord.additions.length ? simulatedChord.additions.map(i=>DEG_L[i]).join(' · ') : (lang==='zh'?'尚未加入新音':'No notes added yet')}<small>{simulatedChord.candidates.length ? `${lang==='zh'?'候選命名':'Candidate name'}: ${simRoot}${simulatedChord.candidates[0]}` : ''}</small></div>
                            <div className="extension-grid">
                                {[
                                    ['+9',lang==='zh'?'加入九度音':'Add the 9th'],
                                    ['+11',lang==='zh'?'加入十一度音':'Add the 11th'],
                                    ['+13',lang==='zh'?'加入十三度音':'Add the 13th'],
                                    ['b9 / #9',lang==='zh'?'變化九度音':'Altered 9ths'],
                                    ['#11',lang==='zh'?'升十一度音':'Sharp 11th'],
                                    ['b13',lang==='zh'?'降十三度音':'Flat 13th']
                                ].map(([symbol,label])=><div key={symbol}><strong>{symbol}</strong><span>{label}</span></div>)}
                            </div>
                        </section>
                    );
                }
                if (!catId) {
                    const list = mode === 'chord' ? db.ch.CHORD_CATEGORIES : db.sc.SCALE_CATEGORIES;
                    const q = libraryQuery.trim().toLowerCase().replace(/^\+/, '');
                    const searchResults = mode === 'chord' && q ? db.ch.CHORD_TYPES.filter(it => [it.label,it.zh,it.en,it.formula].some(v=>(v||'').toLowerCase().includes(q))) : [];
                    return (
                        <div className="max-w-3xl mx-auto mt-20 animate-in">
                            {mode === 'chord' && <div className="library-search">
                                <span>⌕</span><input value={libraryQuery} onChange={e=>setLibraryQuery(e.target.value)} placeholder={lang==='zh'?'搜尋名稱、簡寫或結構，例如 maj7、+11':'Search name, symbol, or formula, e.g. maj7, +11'} />
                                {libraryQuery && <button onClick={()=>setLibraryQuery('')}>×</button>}
                            </div>}
                            {searchResults.length > 0 && <div className="search-results mb-12">
                                <div className="catalog-label">{lang==='zh'?`找到 ${searchResults.length} 個和弦`:`${searchResults.length} chords found`}</div>
                                {searchResults.map(it=><div key={it.id} onClick={()=>setTypeObj(it)} className="gallery-list-item compact"><div><strong>{it.label || 'Major'}</strong><span>{lang==='zh'?it.zh:it.en}</span></div><code>{it.formula}</code></div>)}
                            </div>}
                            <div className="catalog-label text-center mb-10">{lang==='zh'?'分類目錄':'Categories'}</div>
                            {list.map((c, i) => (
                                <div key={c.id} onClick={()=>setCatId(c.id)} className="gallery-list-item">
                                    <h3 className="font-serif">{t.cat[c.key] || c.id}</h3>
                                    <span className="text-bronze opacity-50 text-[10px] tracking-widest uppercase">{lang==='zh'?'選擇':'Select'}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                if (!typeObj) {
                    const cat = (mode === 'chord' ? db.ch.CHORD_CATEGORIES : db.sc.SCALE_CATEGORIES).find(x => x.id === catId);
                    const items = mode === 'chord' ? db.ch.CHORD_TYPES.filter(it => cat.list.includes(it.id)) : db.sc.SCALES.filter(it => cat.list.includes(it.id));
                    return (
                        <div className="max-w-3xl mx-auto mt-20 animate-in">
                            <button onClick={()=>setCatId(null)} className="mb-12 text-bronze text-[11px] uppercase tracking-[0.4em] flex items-center hover:opacity-50 transition">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" className="mr-2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                {t.back}
                            </button>
                            <div className="catalog-label mb-8">{t.cat[cat.key]}</div>
                            {items.map((it, i) => (
                                <div key={it.id} onClick={()=>setTypeObj(it)} className="gallery-list-item">
                                    <div className="flex flex-col">
                                        <span className="text-white text-xl font-serif">{lang==='zh' ? it.zh : it.en}</span>
                                        <span className="text-[10px] text-zinc-600 tracking-widest mt-1 uppercase font-mono">
                                            {mode === 'chord' ? `${lang==='zh'?'譜面簡寫':'Chart symbol'}: ${it.label || '（根音字母）'} · ${it.formula}` : it.intervals.map(i => DEG_L[i]).join(' · ')}
                                        </span>
                                    </div>
                                    <span className="text-[10px] text-bronze/40 font-mono">#{String(i+1).padStart(3,'0')}</span>
                                </div>
                            ))}
                        </div>
                    );
                }
                return (
                    <div className="max-w-4xl mx-auto mt-20 text-center animate-in">
                        <button onClick={()=>setTypeObj(null)} className="mb-12 text-bronze text-[11px] uppercase tracking-[0.4em] flex items-center justify-center hover:opacity-50 transition mx-auto">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" className="mr-2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            {t.back}
                        </button>
                        <div className="catalog-label">{lang==='zh'?'選擇根音':'Select Root'}</div>
                        <h2 className="text-5xl text-white mb-6 font-serif">{lang==='zh' ? typeObj.zh : typeObj.en}</h2>
                        {mode === 'chord' && <div className="text-bronze font-mono tracking-widest mb-16">{lang==='zh'?'譜面簡寫':'Chart symbol'}: C{typeObj.label} · {typeObj.formula}</div>}
                        {mode === 'scale' && typeObj.id === 'minor' && <div className="text-bronze font-mono tracking-widest mb-16">{lang==='zh'?'提示：選擇 G♯ 即為五個升記號的升 G 小調':'Tip: choose G# for G-sharp minor, the minor key with five sharps'}</div>}
                        {mode === 'scale' && typeObj.id !== 'minor' && <div className="mb-16"></div>}
                        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-6">
                            {NOTES_C.map((n, i) => (
                                <button key={n} onClick={()=>setDetail({root:n, typeObj, mode})} className="border border-white/5 py-10 text-white font-serif text-2xl hover:border-bronze hover:text-bronze transition-all">
                                    <span>{n}</span>
                                    {mode === 'scale' && typeObj.id === 'minor' && n === 'G#' && <span className="block mt-2 text-[9px] font-sans tracking-widest text-bronze">{lang==='zh'?'五升小調':'5-sharp minor'}</span>}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-40">
                    <div className="fixed top-8 right-8 flex gap-4 z-[1000] animate-in">
                        <button className={`utility-btn ${lang==='zh'?'active':''}`} onClick={()=>setLang('zh')}>ZH</button>
                        <button className={`utility-btn ${lang==='en'?'active':''}`} onClick={()=>setLang('en')}>EN</button>
                        <div className="w-4"></div>
                        <div className="style-menu">
                            <button type="button" className="utility-btn style-trigger" onClick={()=>setStylePanelOpen(open=>!open)} aria-expanded={stylePanelOpen} aria-haspopup="menu">
                                {lang==='zh'?'更改風格':'Change style'}
                            </button>
                            {stylePanelOpen && <div className="style-panel" role="menu" aria-label={lang==='zh'?'網站風格':'Website styles'}>
                                <div className="style-panel-head">{lang==='zh'?'選擇網站風格':'Choose a website style'}</div>
                                <div className="style-options">
                                    {THEME_OPTIONS.map(option=><button type="button" role="menuitemradio" aria-checked={theme===option.id} key={option.id} onClick={()=>selectTheme(option.id)} className={`style-option ${theme===option.id?'active':''}`}>
                                        <i className={`style-swatch ${option.id}`}></i>{lang==='zh'?option.zh:option.en}
                                    </button>)}
                                </div>
                            </div>}
                        </div>
                    </div>
                    <header className="gallery-header animate-in">
                        <h1 className="gallery-title">{t.title}</h1>
                        <div className="edition-label">{t.edition} / {lang==='zh'?'2026 典藏版':'2026 Collection'}</div>
                        <div className="mt-16 flex justify-center gap-16">
                            <button onClick={()=>{setMode('chord'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='chord'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t.chord}</button>
                            <button onClick={()=>{setMode('scale'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='scale'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t.scale}</button>
                            <button onClick={()=>{setMode('builder'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='builder'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{lang==='zh'?'和弦加音模擬器':'Add-Note Simulator'}</button>
                            <button onClick={()=>{setMode('theory'); setCatId(null); setTypeObj(null);}} className={`text-[13px] tracking-[0.4em] pb-2 border-b-2 transition-all ${mode==='theory'?'text-bronze border-bronze':'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{lang==='zh'?'基本樂理':'Music Theory'}</button>
                        </div>
                        <div className="feature-nav" aria-label={lang==='zh'?'個人工具':'Personal tools'}>
                            {[['favorites',lang==='zh'?'我的收藏':'Favorites'],['recent',lang==='zh'?'最近瀏覽':'Recent'],['compare',lang==='zh'?'指法比較':'Compare'],['practice',lang==='zh'?'練習模式':'Practice'],['transpose',lang==='zh'?'多重和弦查詢':'Multi-Chord Query']].map(([id,label])=><button key={id} onClick={()=>{setMode(id);setCatId(null);setTypeObj(null);}} className={mode===id?'active':''}>{label}{id==='compare'&&compareItems.length>0?<sup>{compareItems.length}</sup>:null}</button>)}
                            {SHOULD_SHOW_RELEASE && <button type="button" onClick={()=>{setClosingUpdateNotice(false);setShowUpdateNotice(true);}}>{lang==='zh'?'更新懶人包':'What’s new'}</button>}
                        </div>
                    </header>
                    <main>{renderMain()}</main>
                    {detail && <DetailSheet {...detail} onClose={()=>setDetail(null)} t={t} lang={lang} onFavorite={toggleFavorite} isFavorite={record=>favorites.some(item=>item.key===record.key)} onCompare={toggleCompare} isCompared={record=>compareItems.some(item=>item.key===record.key)} onVoicingViewed={addRecent} />}
                    <ActionToast notice={notice}/>
                    {showUpdateNotice && <UpdateNotice lang={lang} closing={closingUpdateNotice} onDismiss={dismissUpdateNotice} />}
                    <footer className="text-center py-10 mt-20 border-t border-white/5">
                        <p className="text-[10px] text-zinc-600 tracking-[0.25em] uppercase">
                            © 2026 Brian&amp;Code. All Rights Reserved.
                        </p>
                        <p className="text-[10px] text-zinc-700 tracking-widest mt-2">
                            {lang === 'zh' ? '更多作品請至' : 'Visit us at'}{' '}
                            <a href="https://brian53013new.github.io/Brian-Code-Official-website/" target="_blank" rel="noopener noreferrer" className="text-bronze/60 hover:text-bronze transition-colors underline underline-offset-2">
                                {lang === 'zh' ? 'Brian&Code 官方網站' : 'Brian&Code Official Website'}
                            </a>
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
